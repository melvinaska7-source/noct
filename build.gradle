plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    // Minecraft and Mappings (Yarn dev environment)
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Lombok (Annotation Processor & Compile Only)
    compileOnly "org.projectlombok:lombok:${project.lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
    testCompileOnly "org.projectlombok:lombok:${project.lombok_version}"
    testAnnotationProcessor "org.projectlombok:lombok:${project.lombok_version}"

    // JNA & WebSocket dependencies
    implementation "net.java.dev.jna:jna:${project.jna_version}"
    implementation "net.java.dev.jna:jna-platform:${project.jna_version}"
    implementation "com.neovisionaries:nv-websocket-client:${project.websocket_version}"

    // Local libraries (Figura, Baritone, LuaJ, etc.)
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    // Include JNA and websocket in the output jar
    include "net.java.dev.jna:jna:${project.jna_version}"
    include "net.java.dev.jna:jna-platform:${project.jna_version}"
    include "com.neovisionaries:nv-websocket-client:${project.websocket_version}"
}

loom {
    accessWidenerPath = file("src/main/resources/lavanda.accesswidener")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
    it.options.compilerArgs << "-Xlint:none"
    it.options.compilerArgs << "-AdisableTargetValidator=true"
    it.options.compilerArgs << "-Aquiet=true"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
